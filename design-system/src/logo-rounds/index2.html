<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CenterSpot logo options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Kalam&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F14; --surface: #151B23; --surface2: #1E2630; --hair: #2A3440;
    --text: #F2F5F7; --muted: #93A0AD; --lime: #C6FF3D; --coral: #FF6B4A; --paper: #F2F5F7; --ink: #0B0F14;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: Nunito, system-ui, sans-serif; padding: 56px 48px 64px; }
  header { max-width: 1320px; margin: 0 auto 40px; display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-weight: 900; font-size: 40px; letter-spacing: -0.01em; }
  header p { font-family: Kalam, cursive; color: var(--muted); font-size: 20px; }
  .grid { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
  .card { background: var(--surface); border: 1px solid var(--hair); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .num { font-weight: 800; color: var(--muted); font-size: 13px; }
  .hero { aspect-ratio: 1; background: var(--bg); border-radius: 14px; display: grid; place-items: center; }
  .hero svg { width: 62%; height: 62%; color: var(--text); }
  .row { display: flex; gap: 10px; align-items: center; }
  .icon { width: 64px; height: 64px; border-radius: 15px; background: var(--bg); display: grid; place-items: center; border: 1px solid var(--hair); }
  .icon svg { width: 66%; height: 66%; color: var(--text); }
  .icon.lime { background: var(--lime); border-color: var(--lime); }
  .icon.lime svg { color: var(--ink); --accent: var(--ink); }
  .small { width: 32px; height: 32px; background: var(--bg); border-radius: 7px; display: grid; place-items: center; border: 1px solid var(--hair); }
  .small svg { width: 72%; height: 72%; color: var(--text); }
  .tiny { width: 16px; height: 16px; color: var(--text); }
  .paper { background: var(--paper); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; color: var(--ink); }
  .paper svg { width: 34px; height: 34px; color: var(--ink); --accent: var(--ink); }
  .lockup { display: flex; align-items: center; gap: 10px; padding: 4px 2px; }
  .lockup svg { width: 34px; height: 34px; color: var(--text); }
  .word { font-weight: 900; font-size: 28px; letter-spacing: -0.01em; }
  .paper .word { color: var(--ink); }
  h2 { font-weight: 800; font-size: 19px; }
  .why { color: var(--muted); font-size: 14px; line-height: 1.45; font-weight: 500; }
  svg { --accent: var(--lime); }
</style>
</head>
<body>
<header>
  <h1>CenterSpot · five more, tactics-board vibe</h1>
  <p>Draw the move, not just the shape.</p>
</header>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 1 · X and O: a coach's notation, our O's run curling past their X -->
    <symbol id="m1" viewBox="0 0 100 100">
      <path d="M57 21 L 75 39 M75 21 L 57 39" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
      <circle cx="24" cy="74" r="12" fill="none" stroke="currentColor" stroke-width="7"/>
      <path d="M38 72 C 62 72, 86 64, 85 30" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="9 8"/>
      <path d="M77 24 L 85 14 L 93 24" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- 2 · The box: the goal line, the box and its D, a player arriving -->
    <symbol id="m2" viewBox="0 0 100 100">
      <path d="M12 16 H 88 M26 16 V 50 H 74 V 16" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40 50 A 12 10 0 0 0 60 50" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      <path d="M22 86 C 30 70, 42 56, 50 40" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="9 8"/>
      <circle cx="51" cy="33" r="9" fill="var(--accent)"/>
    </symbol>
    <!-- 3 · Formation A: eight players lined up as the letter, the one at the point leads -->
    <symbol id="m3" viewBox="0 0 100 100">
      <circle cx="50" cy="16" r="8" fill="var(--accent)"/>
      <circle cx="40" cy="38" r="6.5" fill="currentColor"/><circle cx="60" cy="38" r="6.5" fill="currentColor"/>
      <circle cx="31" cy="60" r="6.5" fill="currentColor"/><circle cx="50" cy="60" r="6.5" fill="currentColor"/><circle cx="69" cy="60" r="6.5" fill="currentColor"/>
      <circle cx="22" cy="82" r="6.5" fill="currentColor"/><circle cx="78" cy="82" r="6.5" fill="currentColor"/>
    </symbol>
    <!-- 4 · The overlap: a pitch from above with the run down the left wing, the app's first move -->
    <symbol id="m4" viewBox="0 0 100 100">
      <rect x="22" y="8" width="56" height="84" rx="8" fill="none" stroke="currentColor" stroke-width="5"/>
      <path d="M22 50 H 78" stroke="currentColor" stroke-width="5"/>
      <circle cx="50" cy="50" r="10" fill="none" stroke="currentColor" stroke-width="5"/>
      <path d="M36 82 C 28 70, 27 52, 31 32" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
      <path d="M24 38 L 31 28 L 38 37" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- 5 · Beat your man: our player (a disc) curls a run round theirs (a ring) -->
    <symbol id="m5" viewBox="0 0 100 100">
      <circle cx="56" cy="46" r="12" fill="none" stroke="currentColor" stroke-width="7"/>
      <circle cx="26" cy="78" r="12" fill="var(--accent)"/>
      <path d="M36 70 C 52 66, 80 66, 80 44 C 80 32, 72 24, 62 20" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-dasharray="9 8"/>
      <path d="M70 14 L 60 19 L 66 28" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<main class="grid" id="grid"></main>

<script>
  const options = [
    { id: 'm1', name: 'X and O', why: 'The notation every coach knows: our O, their X, and a chalked run going round the outside. Reads as tactics at any size, without a pitch.' },
    { id: 'm2', name: 'The box', why: 'The goal line, the box and its D, with a player arriving on a dotted run. A corner of a tactics board, where the move ends.' },
    { id: 'm3', name: 'Formation A', why: 'Eight players lined up as a formation that spells the A of the earlier name; the one at the point leads, in lime. A letter made of a team shape.' },
    { id: 'm4', name: 'The overlap', why: 'A pitch from above with a run down the left wing: the app\'s own example move, "Overlap down the left", as the mark.' },
    { id: 'm5', name: 'Beat your man', why: 'Our player (a filled disc) curls a run round theirs (a ring): the app\'s side rule and a move in one. Pure tactics-board grammar.' },
  ];
  const use = id => `<svg viewBox="0 0 100 100"><use href="#${id}"/></svg>`;
  document.getElementById('grid').innerHTML = options.map((o, i) => `
    <section class="card">
      <span class="num">${i + 1}</span>
      <div class="hero">${use(o.id)}</div>
      <div class="row">
        <div class="icon">${use(o.id)}</div>
        <div class="icon lime">${use(o.id)}</div>
        <div class="small">${use(o.id)}</div>
        <svg class="tiny" viewBox="0 0 100 100"><use href="#${o.id}"/></svg>
      </div>
      <div class="lockup">${use(o.id)}<span class="word">CenterSpot</span></div>
      <div class="paper">${use(o.id)}<span class="word">CenterSpot</span></div>
      <h2>${o.name}</h2>
      <p class="why">${o.why}</p>
    </section>`).join('');
</script>
</body>
</html>

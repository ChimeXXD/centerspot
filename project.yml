# XcodeGen spec. Edit this file, then run `xcodegen generate`. Never hand-edit the .xcodeproj (D-04).
# Signing and IDs live in Config/Base.xcconfig, overridden by the git-ignored Config/Signing.local.xcconfig.
# Day 0 creates Agmen/ and AgmenTests/ so this generates.
name: Agmen

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone and iPad (D-03)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Agmen:
    type: application
    platform: iOS
    sources:
      - path: Agmen
        excludes: ["Info.plist", "Agmen.entitlements"]
      - path: presets/formations.json
        buildPhase: resources
      - path: presets/roles.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).agmen
    info:
      path: Agmen/Info.plist
      properties:
        CFBundleDisplayName: $(DISPLAY_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        # INFOPLIST_KEY_* settings are ignored without GENERATE_INFOPLIST_FILE, so orientations live here.
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The .tactic document type (D-09, docs/FORMAT.md)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.chime.agmen.tactic
            UTTypeDescription: Tactic
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [tactic]
              public.mime-type: [application/vnd.chime.tactic+json]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Tactic
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.chime.agmen.tactic]
        # Links without a server (D-10): agmen://t#v1.<payload>
        CFBundleURLTypes:
          - CFBundleURLName: dev.chime.agmen.link
            CFBundleURLSchemes: [agmen]
        NSPhotoLibraryAddUsageDescription: Save exported videos and images of your tactics to Photos.
    entitlements:
      path: Agmen/Agmen.entitlements
      properties: {}

  AgmenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AgmenTests
      - path: examples
        buildPhase: resources
    dependencies:
      - target: Agmen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).agmen.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Agmen:
    build:
      targets:
        Agmen: all
        AgmenTests: [test]
    test:
      targets:
        - AgmenTests

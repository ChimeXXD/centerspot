# XcodeGen spec. Edit this file, then run `xcodegen generate`. Never hand-edit the .xcodeproj (D-04).
# Signing and IDs live in Config/Base.xcconfig, overridden by the git-ignored Config/Signing.local.xcconfig.
# Day 0 creates CenterSpot/ and CenterSpotTests/ so this generates.
name: CenterSpot

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone and iPad (D-03)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  CenterSpot:
    type: application
    platform: iOS
    sources:
      - path: CenterSpot
        excludes: ["Info.plist", "CenterSpot.entitlements"]
      - path: presets/formations.json
        buildPhase: resources
      - path: presets/roles.json
        buildPhase: resources
      # Scenario moves (D-96), generated from mockup/scenario-motion.js.
      - path: presets/scenario-moves.json
        buildPhase: resources
      # The hero move (D-29): added to the library on first launch (D-56); Debug -openExample opens it.
      - path: examples/overlap-left.tactic
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).centerspot
        # The CenterSpot mark on the brand ink (D-86): one 1024 px image; iOS rounds it and makes the smaller sizes.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: CenterSpot/Info.plist
      properties:
        CFBundleDisplayName: $(DISPLAY_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Floodlight Chalk is dark only (D-44).
        UIUserInterfaceStyle: Dark
        # CenterSpot draws its own library (D-56): tactics live in Documents, which Files shows as On My iPhone › CenterSpot.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # INFOPLIST_KEY_* settings are ignored without GENERATE_INFOPLIST_FILE, so orientations live here.
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The .tactic document type (D-09, docs/FORMAT.md): files from AirDrop, WhatsApp or Files open in CenterSpot (D-56)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.chime.centerspot.tactic
            UTTypeDescription: Tactic
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [tactic]
              public.mime-type: [application/vnd.chime.tactic+json]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Tactic
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.chime.centerspot.tactic]
        # Links without a server (D-10): centerspot://t#v1.<payload>
        CFBundleURLTypes:
          - CFBundleURLName: dev.chime.centerspot.link
            CFBundleURLSchemes: [centerspot]
        # Floodlight Chalk type (D-44): SIL Open Font License, licences in CenterSpot/Design/Fonts/
        UIAppFonts: [Nunito-Variable.ttf, Kalam-Regular.ttf]
        NSPhotoLibraryAddUsageDescription: Save exported videos and images of your tactics to Photos.
    entitlements:
      path: CenterSpot/CenterSpot.entitlements
      properties: {}

  CenterSpotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CenterSpotTests
        excludes: ["Fixtures"]
      # .tactic fixtures, copied flat into the test bundle (start from examples/, D-29)
      - path: CenterSpotTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: CenterSpot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).centerspot.tests
        GENERATE_INFOPLIST_FILE: YES

  # Drives the real app for screenshots and accessibility checks; its own scheme keeps `test` unit-only.
  CenterSpotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CenterSpotUITests
    dependencies:
      - target: CenterSpot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).centerspot.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CenterSpot

schemes:
  CenterSpotUITests:
    build:
      targets:
        CenterSpot: all
        CenterSpotUITests: [test]
    test:
      targets:
        - CenterSpotUITests
  CenterSpot:
    build:
      targets:
        CenterSpot: all
        CenterSpotTests: [test]
    test:
      targets:
        - CenterSpotTests
